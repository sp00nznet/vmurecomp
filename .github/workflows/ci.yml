name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # The harness prints its pass/fail count, so the log carries the number
      # even when nothing regressed. It exits non-zero on a regression against
      # tests/conformance-baseline.txt, not merely on total failure.
      - name: Conformance
        shell: bash
        run: |
          BIN=build/tests/conform
          [ -x "$BIN" ] || BIN=build/tests/Release/conform.exe
          "$BIN" "" tests/conformance-baseline.txt

  warnings:
    name: warnings are errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
      - name: Build
        run: cmake --build build
